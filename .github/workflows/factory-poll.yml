# dm Development Factory – Async-Trigger (ADR-008, Option A: Scheduled-Poll).
#
# Läuft ausschließlich auf manuelles `workflow_dispatch`. Sucht Issues mit Label
# `factory::run` und startet fail-closed hinter dem Budget-Guard die
# Factory-Pipeline (scripts/factory-poll.sh → scripts/run-pipeline.sh).
#
# Der halbstündliche `schedule`-Trigger ist stillgelegt (#284): Der Auto-Trigger ist
# nicht scharfgeschaltet (kein ANTHROPIC_API_KEY im Repo, nie ein factory::run-Issue),
# der Poll installierte also 48× am Tag Software mit Repo-Schreibrechten, um
# festzustellen, dass es nichts zu tun gibt. Wiedereintragen ist ein Aktivierungs-
# schritt der Checkliste unten (OPERATING.md §0.4), kein Default.
#
# concurrency = Concurrency=1 über Läufe hinweg: zwei Läufe
# überlappen nie (zweite Hälfte der Idempotenz; erste ist der In-Skript-Check).
#
# Einrichtung (einmalig, projektspezifisch):
#   - Repository-Secret ANTHROPIC_API_KEY (oder ANTHROPIC_BASE_URL für ein Gateway, #17)
#   - Labels anlegen: factory::run / ::running / ::done / ::interrupted / ::failed
#   - `schedule`-Trigger wieder eintragen (unten unter `on:`) – erst dann läuft der
#     Poll wieder von selbst; Vorbedingung ist die gepinnte claude-CLI (#290).
#     Dieser Punkt kommt zuletzt: er schaltet die Automatik scharf (OPERATING.md §0.4)
#   - optional Repository-Variable FACTORY_MAX_RUNS_PER_DAY (Default 5),
#     FACTORY_RUN_TIMEOUT (Stale-Reaper, Default 3600s)
#   - Der eingebaute GITHUB_TOKEN darf Issues/Labels schreiben und Commits pushen
#     (permissions unten). Pushes mit GITHUB_TOKEN lösen KEINE weitere Pipeline aus
#     (kein Trigger-Loop).

name: Factory Poll

on:
  workflow_dispatch: {}

# Issues/Labels schreiben + Repo-Commits pushen; zusätzlich lesend für die Prozess-Metriken
# (ADR-045, #314): metrics.sh braucht `gh pr list` (Lead-Time) und `gh run list` (CI-Quote) –
# ohne diese zwei Read-Scopes liefen beide API-Kennzahlen in CI dauerhaft "übersprungen".
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

# Concurrency=1 über Workflow-Läufe hinweg (Idempotenz-Hälfte 2). Laufende
# Läufe werden NICHT abgebrochen (kein cancel-in-progress) – ein aktiver
# Factory-Lauf darf zu Ende laufen.
concurrency:
  group: factory-runtime
  cancel-in-progress: false

jobs:
  factory-poll:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FACTORY_REPO: ${{ github.repository }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FACTORY_MAX_RUNS_PER_DAY: ${{ vars.FACTORY_MAX_RUNS_PER_DAY }}
      FACTORY_RUN_TIMEOUT: ${{ vars.FACTORY_RUN_TIMEOUT }}
    steps:
      - uses: actions/checkout@v4
      # yq kommt über den zentralen Seam: gepinnte Version + SHA-256-Verifikation gegen die
      # Release-Checksums, statt ein `latest`-Asset ungeprüft auszuführen (#258). Dieser Job
      # läuft mit `contents: write` + `issues: write` – ein manipuliertes Asset hätte hier
      # Schreibzugriff auf Repo und Issues. (Das Secret ANTHROPIC_API_KEY existiert im Repo
      # nicht; bis es gesetzt wird, läuft der Job ohne dieses Secret – #284/#290.)
      - name: Runtime bereitstellen (claude-CLI + yq)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          sudo bash scripts/install-yq.sh
      - name: factory::run-Issues pollen
        run: bash scripts/factory-poll.sh
