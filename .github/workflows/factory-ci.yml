# Development Factory – GitHub Actions CI
#
# Gates statt Vertrauen: dieselben Checks, die lokal über scripts/checks/ laufen,
# laufen hier automatisch bei jedem Push und Pull Request.
#
# Konfiguration für adoptierte Projekte (nach /setup-project):
#   - Lint/Test des Projekts laufen NICHT hier, sondern im projekteigenen ci.yml
#     (Jobs `lint`/`test`, nothra/tch-gastro-services#431) – diese Datei enthält nur Factory-Jobs.
#   - FACTORY_HEALTHCHECK_URL bzw. FACTORY_HEALTHCHECK_CMD für post-merge-verify
#     (optional, nur wenn ein Deploy-Ziel existiert). Achtung Timing: post-merge-verify
#     läuft parallel zum Deploy-Gate (vor dem Promote) – FACTORY_HEALTHCHECK_URL daher
#     NICHT auf /api/health zeigen (Fehlalarme). Details am Job-Kommentar unten / ADR-017.
# Der "factory-self-test"-Job läuft immer und braucht keine Anpassung.

name: Factory CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  # ─── PR-Closing-Keyword-Gate ────────────────────────────────────────────────
  # Ein gemergter PR schließt sein Issue nur, wenn der PR-Body ein GitHub-Closing-
  # Keyword mit Issue-Referenz enthält (z. B. "Closes #<id>"). Fehlt es, bleibt das
  # Issue offen (beobachtet nothra/tch-gastro-services#71/#74/#76/#78) und start-work.sh legt später einen
  # redundanten Worktree an. Läuft nur bei pull_request (bei push gibt es keinen Body).
  pr-closes-issue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PR-Body auf Closing-Keyword prüfen
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
        run: bash scripts/checks/pr-closes-keyword-check.sh

  # ─── Issue-Sync-Gate ────────────────────────────────────────────────────────
  # Invariante (ADR-013): jede tasks/task-<id>-*.md hat ein GitHub-Issue #<id>.
  # Read-only Check – schlägt fehl (exit 1), wenn ein Task kein Issue-Pendant hat.
  issue-sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FACTORY_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Task ↔ Issue-Sync prüfen
        run: bash scripts/sync-issues.sh --check

  # ─── Config-Validation-Gate (ADR-041, Task 255) ─────────────────────────────
  # Fail-closed Validierung der geschichteten Factory-Config (factory.defaults.yml
  # * factory.config.yml) als eigener, benannter Required-Check — bislang lief das
  # Gate in CI nur indirekt über eine Testzeile in run-tests.sh (Gate nothra/tch-gastro-services#249 AK5).
  # Ruft das Gate explizit gegen die realen Repo-Dateien auf, unabhängig von
  # run-pipeline.sh oder einer Test-Fixture. Kein Node-Setup nötig (analog issue-sync).
  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yq bereitstellen
        run: sudo bash scripts/install-yq.sh
      - name: Config-Validation-Gate (fail-closed)
        run: |
          bash scripts/checks/config-validation-check.sh \
            "$GITHUB_WORKSPACE/factory.defaults.yml" \
            "$GITHUB_WORKSPACE/factory.config.yml"

  # ─── Integritäts-Gate (Factory-ADR-063 E8) ──────────────────────────────────
  # Übernommene Factory-Dateien sind unverändert: Hashes gegen factory.lock und der Lock gegen das
  # Release-Manifest des Tags aus upstream.repo (fängt auch Datei + Hash gemeinsam geändert). Fail-closed,
  # wenn Factory-Repo, Tag oder Manifest nicht erreichbar sind. Im Factory-Repo (kein factory.lock) ein
  # No-op und kein Required Check; im Konsumenten trägt ihn das Ruleset ein.
  factory-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yq bereitstellen
        run: sudo bash scripts/install-yq.sh
      - name: Integritäts-Gate (CI-Stufe)
        run: bash scripts/checks/factory-integrity-check.sh --ci

  # ─── Factory-eigene Checks ──────────────────────────────────────────────────
  # Prüft die Integrität der Factory-Skripte selbst (Self-Test-Suite).
  # Läuft immer – auch in adoptierten Projekten, die das Template als Basis nutzen.
  # bash/git/jq sind auf ubuntu-latest vorinstalliert; yq (mikefarah) wird geholt,
  # weil die gedogfoodete Self-Test-Suite run-pipeline.sh ausführt, das
  # factory.defaults.yml via yq liest (ADR-009, Phase 1b). Die Bereitstellung läuft in
  # jedem Job über scripts/install-yq.sh – gepinnte Version + SHA-256-Verifikation gegen
  # die Release-Checksums, statt ein `latest`-Asset ungeprüft auszuführen (nothra/tch-gastro-services#258).
  factory-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yq bereitstellen
        run: sudo bash scripts/install-yq.sh
      # Ein frischer CI-Checkout hat wie jeder frische Clone keine installierten Hooks
      # (README/CLAUDE.md: einmalig auszuführen). scripts/checks/tests/run-tests.sh ruft
      # pre-push.sh weiter unten (nothra/tch-gastro-services#149-Format-Gate-Test) echt gegen dieses Checkout auf –
      # ohne installierte Hooks schlägt der Git-Hooks-Installiert-Check (nothra/tch-gastro-services#265, ADR-042)
      # dort IMMER fehl und reißt den Format-Gate-Test mit (falsch-rot, kein echter Defekt).
      - name: Git-Hooks installieren
        run: bash scripts/install-hooks.sh
      - name: Self-Test-Suite
        run: bash scripts/checks/tests/run-tests.sh

  # ─── Post-Merge-Verifikation ─────────────────────────────────────────────────
  # Läuft NUR nach echtem Merge (push auf main) – CI-grün ≠ Produktion-grün
  # (ADR-007). Prüft das tatsächliche Verhalten der deployten Umgebung per
  # Healthcheck gegen FACTORY_HEALTHCHECK_URL / FACTORY_HEALTHCHECK_CMD. Ohne
  # Konfiguration: übersprungen. Schlägt der Check fehl → POST_MERGE_FAIL + rot.
  #
  # ⚠ FACTORY_HEALTHCHECK_URL NICHT auf .../api/health zeigen: Dieser Job läuft beim
  #   main-Push PARALLEL zum Deploy-Gate – also BEVOR das Gate main→production promotet.
  #   Ein /api/health-Check träfe hier den Vor-Promote-Stand von Production → Fehlalarme.
  #   Der autoritative Post-Deploy-Healthcheck liegt bewusst IM Deploy-Gate (nach dem
  #   Promote), nicht hier (ADR-017 §Alternatives). Für diesen Job höchstens einen
  #   deploy-unabhängigen Smoke-Test (FACTORY_HEALTHCHECK_CMD) verwenden.
  #
  # Bewusst NICHT bei pull_request: vor dem Merge ist nichts deployt.
  post-merge-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FACTORY_HEALTHCHECK_URL: ${{ vars.FACTORY_HEALTHCHECK_URL }}
      FACTORY_HEALTHCHECK_CMD: ${{ vars.FACTORY_HEALTHCHECK_CMD }}
    steps:
      - uses: actions/checkout@v4
      - name: Post-Merge-Healthcheck
        run: bash scripts/post-merge-verify.sh
