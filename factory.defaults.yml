# ─────────────────────────────────────────────────────────────────────────────
# factory.defaults.yml — kanonische Default-Konfiguration der Factory (ADR-009)
# ─────────────────────────────────────────────────────────────────────────────
#
# STATUS: Phase 1a von Issue #25. Diese Datei BÜNDELT die heute in
# scripts/run-pipeline.sh hartkodierten Werte (get_model/get_max_turns) an EINER
# Stelle — als Single Source of Truth + Lehr-Artefakt. In dieser Phase LIEST sie
# noch niemand (Verhalten unverändert); das Umstellen von run-pipeline.sh auf
# diese Datei (via yq) ist der nächste Schritt, sobald ADR-009 final ist.
#
# Schichtung (ADR-009 #1): Teams überschreiben einzelne Werte in einer eigenen
# factory.config.yml; defaults + override → effektive Config. Diese Datei NIE im
# adoptierten Projekt direkt editieren — sie kommt per Template-Update.
#
# Begründungs-Konvention (ADR-011): Jeder Knopf trägt seine Begründung als
# strukturierten Kommentar am Knopf — Tag @reason (warum es den Knopf/Default
# gibt) und Tag @tradeoff (was man beim Ändern aufgibt). Dimensions-Ebene =
# eigenständige `#`-Zeilen über dem Schlüssel; Wert-Ebene = Trailing-Kommentar
# auf der Knopf-Zeile. Dies ist die EINZIGE Heimat dieser Texte — die Wizards
# (/setup-project, /configure-factory), factory.config.yml.example und etwaige
# Inline-Kommentare VERWEISEN hierauf, statt zu kopieren (Anti-Drift, Spec #35
# Kriterium C). Env-Var-Hinweise (`# CLAUDE_MODEL_HEAVY`) und Abschnitts-Header
# tragen bewusst KEIN `@`-Tag und sind damit klar von der Quelle getrennt.
#
# schemaVersion: erlaubt späteres Validieren von Overrides gegen bekannte Keys.
schemaVersion: 1

# Modell-Tiers: WELCHE Modelle hinter "heavy"/"light" stehen. Die konkreten IDs
# bleiben über Env-Vars überschreibbar (Kosten-Hebel), Default wie heute:
#   heavy → schweres Reasoning (Implementieren, Reviewen, Security)
#   light → der Rest
# (Globaler Override CLAUDE_MODEL sticht weiterhin alles, siehe run-pipeline.sh.)
# @reason: Trennt schweres Reasoning (Implementieren/Reviewen/Security) vom Rest,
#   damit teure Modelle nur dort laufen, wo sie sich lohnen.
# @tradeoff: heavy senkt die Fehlerrate, kostet aber mehr pro Turn; light spart,
#   muss bei komplexem Reasoning aber ggf. nachfassen.
# Seit Task 249 ist model_tiers.heavy per Gate-Policy (config-validation-check.sh,
# Regel 6) nicht mehr per Team-Override änderbar (unabhängig vom Wert) — ein
# Remapping auf ein schwächeres Modell würde die Mindest-Tier-Policy aus Task 241
# unterlaufen, ohne selbst dagegen zu verstoßen. Modell-ID-Pflege für 'heavy' läuft
# künftig ausschließlich hier (Template-Update). model_tiers.light bleibt frei
# override-bar.
model_tiers:
  heavy: claude-opus-5-5   # CLAUDE_MODEL_HEAVY
  light: claude-sonnet-5-5 # CLAUDE_MODEL_LIGHT

# Pro Skill: Tier (→ Modell) + max_turns (Kosten-Deckel). Jeder Wert hat eine
# Begründung am Knopf — das ist der Sinn von YAML statt JSON (ADR-009 #2).
# @reason: tier wählt das Modell pro Skill, max_turns deckelt die Kosten je Lauf —
#   die zwei Knöpfe, die ein Team realistisch justiert.
# @tradeoff: höheres tier / mehr max_turns = mehr Spielraum und Qualität, aber
#   teurer pro Lauf; niedriger spart, kann aber Qualität kosten oder vorzeitig
#   abbrechen.
#
# Größenabhängige Tier-Wahl (ADR-038): review/implement/bug-fix wählen das Tier
# NICHT mehr pauschal, sondern je nach Größe des einzelnen Laufs über das optionale
# Feld `tier_by_size`. Das statische `tier` bleibt daneben stehen und dient als
# Fail-Safe: greift, wenn die Größe nicht bestimmbar ist (git-Fehler, fehlende Spec)
# — dann läuft der teure Fall (heavy), nie ein stilles Downgrade auf light.
# @reason: teure Modelle nur, wo der Aufwand sie rechtfertigt (kleiner Lauf → light,
#   großer → heavy); Signal = Diff-Zeilen (review) bzw. AK-Zahl der Spec (implement/
#   bug-fix, da der Diff bei der Modellwahl noch nicht existiert).
# @tradeoff: Schwellwerte sind Richtwerte und kalibrierbar — zu niedrig wählt zu oft
#   heavy (teurer), zu hoch lässt große Läufe auf light laufen (mehr Review-Runden).
skills:
  implement:
    tier: heavy                                    # @reason: Fail-Safe, wenn die Proxy-Größe nicht bestimmbar ist (F2).
    tier_by_size: { signal: proxy, threshold: 6 }  # @reason: AK-Zahl der Spec als Aufwand-Proxy; < 6 → light, >= 6 → heavy. @tradeoff: misst Spec-Detailtiefe, nicht garantiert Implementierungsaufwand (kalibrierbar, ADR-038).
    max_turns: 20                                  # @reason: TDD-Zyklen, schreibt Code.
  review:
    tier: heavy                                    # @reason: Fail-Safe, wenn die Diff-Größe nicht bestimmbar ist (F1).
    tier_by_size: { signal: diff, threshold: 150 } # @reason: reine Lese-Analyse, läuft pro Feature ggf. mehrfach → kleiner Diff (< 150 Zeilen) rechtfertigt light. @tradeoff: Richtwert ~150, kalibrierbar (ADR-038).
    max_turns: 30                                  # @reason: Lese-Analyse über mehrere Personas; 14 riss bei größeren Diffs vor dem Verdict-Report (Task 241, validierter Wert), 8 schon früher (Task 91).
  bug-fix:
    tier: heavy                                    # @reason: Fail-Safe, wenn die Proxy-Größe nicht bestimmbar ist (F2).
    tier_by_size: { signal: proxy, threshold: 6 }  # @reason: wie implement (reproduzieren → fixen); Proxy = AK-Zahl der Spec.
    max_turns: 20                                  # @reason: wie implement: reproduzieren → fixen.
  security-review: { tier: heavy, max_turns: 30 }  # @reason: bewusst FIX heavy, KEIN tier_by_size — ein übersehenes Finding ist teurer als der Token-Aufpreis, unabhängig von der Diff-Größe (ADR-038, token-efficiency.md §6); 14 riss bei größeren Diffs vor dem Verdict-Report (Task 241, validierter Wert), 8 schon früher (Task 91).
  test:            { tier: light, max_turns: 20 }  # @reason: Test-Suite vervollständigen, wenig schweres Reasoning.
  refactor:        { tier: light, max_turns: 20 }  # @reason: Clean-Code-Pass, kein neues Verhalten.
  codify:          { tier: light, max_turns: 8 }   # @reason: Learnings extrahieren.
  pr-shepherd:     { tier: light, max_turns: 8 }   # @reason: PR-Lifecycle-Orchestrierung.

  # Phase-1-Skills (requirements/architecture/release-notes) tragen bewusst KEINEN eigenen
  # Eintrag: run-pipeline.sh ruft sie nie über run_skill auf (Phase 1 ist immer interaktiv),
  # ihre Config wäre inert. Sie fallen über cfg_skill_field (.skills.<s>.<feld> // .default.<feld>)
  # sauber auf den default-Block (light, max_turns 10) zurück — kein stilles Heavy-Upgrade.

# Fallback für Skills ohne eigenen Eintrag (heute: get_*-default).
# @reason: Sicherer, günstiger Default für Skills ohne eigenen Eintrag.
default:
  tier: light
  max_turns: 10

# Gate-Kommandos des Projekts (ADR-063 D3, #431): Lint/Test/Typecheck/Format/Coverage und der
# Install-Schritt von start-work.sh. Bewusst OHNE Default-Werte – die Factory kennt keinen
# Paketmanager; das Projekt trägt seine Kommandos in factory.config.yml ein. Die leeren Werte
# machen die Schlüssel nur zur erlaubten Oberfläche (config-validation Regel 2). Env-Override:
# FACTORY_<LINT|TEST|TYPECHECK|FORMAT|COVERAGE>_COMMAND hat Vorrang.
# @reason: Ein pnpm-Default in der Factory wäre eine Projektannahme, die jedem anderen Stack
#   stillschweigend ein falsches Gate unterschöbe – fehlt ein Pflicht-Kommando, bricht das Gate
#   stattdessen mit dem Schlüsselnamen ab.
# @tradeoff: Ein frisch adoptiertes Projekt hat rote Gates, bis es commands.* einträgt; dafür
#   läuft nie ein Gate gegen das falsche Werkzeug. Leerer Format-Wert = Format-Gate übersprungen.
commands:
  lint: ""
  test: ""
  typecheck: ""
  format: ""
  coverage: ""
  install: ""

# Hinweis, den start-work.sh nach dem Kopieren der .env.local ausgibt (Q4, #431). Leer = kein Hinweis.
# @reason: Projektspezifische Nacharbeit (z. B. DB-Seed) gehört nicht in das generische Skript.
# @tradeoff: keiner – ohne Eintrag entfällt der Hinweis still.
start_work:
  hint: ""

# GitHub-Labels (ADR-063 D3, #431): `kinds` = Art-Labels (genau eines je Issue), `aspects` = generische
# Aspekt-Labels (null bis mehrere). Projekteigene Aspekte trägt das Projekt in factory.config.yml unter
# `labels.aspects_extra` (leere Liste hier = erlaubte Oberfläche); Bedeutung und Zuordnungsregel stehen
# in PROJECT-CONTEXT.md. Schema und generische Labels beschreibt docs/factory/guidelines/git-workflow.md.
# Der Issue-Seam validiert Labels bewusst nicht (ADR-018 §3, fail-open) – die Listen sind die Quelle der
# Doku und ihres Drift-Guards, nicht ein Filter.
# @reason: Eine Quelle für die Label-Menge statt Aufzählungen, die einzeln driften; die Factory kennt
#   nur die generischen Labels, projekteigene gehören dem Projekt.
# @tradeoff: Ein neues Label braucht einen Eintrag hier bzw. in aspects_extra UND die Beschreibung in der
#   Doku – der Drift-Guard in der Self-Test-Suite meldet, wenn eines von beiden fehlt.
labels:
  kinds: [bug, enhancement, documentation]
  aspects: [security, tech-debt, test]
  aspects_extra: []
